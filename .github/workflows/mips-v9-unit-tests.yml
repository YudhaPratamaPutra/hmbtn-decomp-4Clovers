name: MIPS V9 Unit Tests

on:
  pull_request:
    paths:
      - "tools/mips/**"
      - "tools/mips_auto_integrator.py"
      - "tests/**"
      - "cmake/overlay.ld.in"
      - "src/overlay/**/mod/**"
      - ".github/workflows/mips-v9-unit-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MIPS GNU binutils
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-mips-linux-gnu

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
