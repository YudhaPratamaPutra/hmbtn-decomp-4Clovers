# Build the 14 code binaries on pull requests. Manual runs also fetch the
# original disc image, build/check the full disc, and replace the Google Drive build.
name: build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t hmbtn-build .

      - name: Download original disc image
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/original-disc"
          gh release download Disc --repo "$GITHUB_REPOSITORY" \
            --pattern disc.bin --dir "$RUNNER_TEMP/original-disc"
          echo "41f81532a5fd70d6f79e7b5750513c35eee732d5e31ba144a1db7e90d84d97de  $RUNNER_TEMP/original-disc/disc.bin" | sha256sum -c -

      - name: Build and check code binaries
        if: github.event_name != 'workflow_dispatch'
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src hmbtn-build
          bash -c 'cmake -S . -B build -G Ninja && cmake --build build --target check'

      - name: Build and check full disc
        if: github.event_name == 'workflow_dispatch'
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src
          -v "$RUNNER_TEMP/original-disc":/disc:ro -w /src hmbtn-build
          bash -c 'cmake -S . -B build -G Ninja -DORIGINAL_DISC=/disc/disc.bin && cmake --build build --target check'

      - name: Generate progress report
        run: |
          curl -fsSL -o objdiff-cli \
              https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          echo "e5445089a6f707e30cb5e02992451b604619cedfd2660ee2373a86bfefd9e718  objdiff-cli" | sha256sum -c -
          chmod +x objdiff-cli
          python3 tools/objdiff_config.py build > objdiff.json
          ./objdiff-cli report generate -o build/report.json

      # GDRIVE_CONFIG must contain a complete rclone config with a remote named "gdrive".
      # rclone sync replaces the destination contents, including deleting stale remote files.
      - name: Install rclone
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure Google Drive
        if: github.event_name == 'workflow_dispatch'
        env:
          GDRIVE_CONFIG: ${{ secrets.GDRIVE_CONFIG }}
        run: |
          if [ -z "$GDRIVE_CONFIG" ]; then
            echo "::error::GitHub Actions secret GDRIVE_CONFIG is not configured."
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          umask 077
          printf '%s' "$GDRIVE_CONFIG" > "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep -Fxq 'gdrive:' || {
            echo "::error::rclone config must define a remote named gdrive."
            exit 1
          }

      - name: Replace Google Drive build contents
        if: github.event_name == 'workflow_dispatch'
        run: |
          test -d build
          rclone sync build gdrive:HMBTN-Builds \
            --create-empty-src-dirs \
            --fast-list \
            --verbose
