# Build the 14 code binaries, check them against the original's SHA-1, and publish the
# progress report decomp.dev reads (artifact SLUS_011.15_report). Needs no game data.
name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and validate FARM integration
        run: docker build -t hmbtn-build .

      - name: Download original disc image
        env:
         GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/original-disc"
          gh release download Disc --repo "$GITHUB_REPOSITORY" \
          --pattern disc.bin --dir "$RUNNER_TEMP/original-disc"

      - name: Build and check
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/src -w /src
          -v "$RUNNER_TEMP/original-disc":/disc:ro -w /src hmbtn-build
          bash -c 'cmake -S . -B build -G Ninja -DORIGINAL_DISC=/disc/disc.bin &&
          cmake --build build --target disc mips-integrate-farm'

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: harvest-moon-modified-rom
          path: |
            build/disc.bin
            build/disc.cue
          if-no-files-found: error
          retention-days: 7

      - name: Upload FARM integration inputs and sidecar
        uses: actions/upload-artifact@v4
        with:
          name: farm-integration-verification
          path: |
            build/11_GF_FARM.bin
            build/11_GF_FARM.mod.bin
            build/program.map
          if-no-files-found: error
          retention-days: 7

      - name: Progress report
        run: |
          curl -fsSL -o objdiff-cli \
              https://github.com/encounter/objdiff/releases/download/v3.8.2/objdiff-cli-linux-x86_64
          echo "e5445089a6f707e30cb5e02992451b604619cedfd2660ee2373a86bfefd9e718  objdiff-cli" | sha256sum -c -
          chmod +x objdiff-cli
          python3 tools/objdiff_config.py build > objdiff.json
          ./objdiff-cli report generate -o build/report.json

      - name: Upload the report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: SLUS_011.15_report
          path: build/report.json
