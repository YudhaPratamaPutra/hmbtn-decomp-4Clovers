
name: MIPS Overlay Discovery

on:
  pull_request:
    paths:
      - "tools/mips/**"
      - "tools/mips_auto_integrator.py"
      - "src/overlay/**"
      - ".github/workflows/mips-overlay-discovery.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay-discovery:
    name: Discover All MIPS Overlays
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run overlay discovery
        run: |
          python3 tools/mips_auto_integrator.py overlay-discover --root src/overlay
          
