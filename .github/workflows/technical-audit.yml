name: technical-audit

on:
  pull_request:
    paths:
      - ".github/workflows/technical-audit.yml"
      - "CMakeLists.txt"
      - "cmake/**"
      - "disc/**"
      - "src/**"
      - "Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-linker-and-boot-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the PSX toolchain image
        run: docker build -t hmbtn-build .

      - name: Download and verify the original disc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/original-disc"
          gh release download Disc --repo "$GITHUB_REPOSITORY" \
            --pattern disc.bin --dir "$RUNNER_TEMP/original-disc"
          echo "41f81532a5fd70d6f79e7b5750513c35eee732d5e31ba144a1db7e90d84d97de  $RUNNER_TEMP/original-disc/disc.bin" | sha256sum -c -

      - name: Build, extract original disc files, and run checks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/src \
            -v "$RUNNER_TEMP/original-disc":/disc:ro \
            -w /src hmbtn-build \
            bash -c 'cmake -S . -B build -G Ninja -DORIGINAL_DISC=/disc/disc.bin && cmake --build build --target check'

      - name: Publish linker and boot evidence in the job summary
        run: |
          {
            echo "## Original SYSTEM.CNF"
            echo
            echo '~~~text'
            cat build/original/disc/SYSTEM.CNF
            echo '~~~'
            echo
            echo "## Evidence file fingerprints"
            sha256sum build/program.map build/program.ld build/program.elf build/SLUS_011.15 build/original/disc/SYSTEM.CNF
            wc -c build/program.map build/program.ld build/program.elf build/SLUS_011.15 build/original/disc/SYSTEM.CNF
            echo
            echo "## Linker map: load regions, sections, and requested symbols"
            grep -n -E 'overlay_low|overlay_high|main_region_free_bytes|main_region_free_start|main_get_region_base|main_run_frame|farm_state_init|farm_load_hook|farm_mode_tick|weather_frame_update_hook|__bss_start|__bss_end' build/program.map || true
            echo
            echo "## ELF symbol addresses"
            docker run --rm -v "$PWD/build":/build hmbtn-build bash -lc \
              "mips-linux-gnu-nm -n /build/program.elf | grep -E ' (main_region_free_bytes|main_region_free_start|main_get_region_base|main_run_frame|farm_state_init|farm_load_hook|farm_mode_tick|weather_frame_update_hook)$' || true"
            echo
            echo "## ELF section layout"
            docker run --rm -v "$PWD/build":/build hmbtn-build \
              mips-linux-gnu-objdump -h /build/program.elf
          } | tee /tmp/technical-audit-summary.txt
          cat /tmp/technical-audit-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Emit complete linker map to job logs for audit retention
        run: |
          echo "===BEGIN_PROGRAM_MAP==="
          cat build/program.map
          echo "===END_PROGRAM_MAP==="

      - name: Compare original and rebuilt PS-X EXE headers
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import struct

          files = {
              "original": pathlib.Path("build/original/disc/SLUS_011.15"),
              "rebuilt": pathlib.Path("build/SLUS_011.15"),
          }
          fields = ("pc0", "gp0", "text_addr", "text_size", "data_addr",
                    "data_size", "bss_addr", "bss_size", "sp_addr", "sp_size")
          for name, path in files.items():
              data = path.read_bytes()
              if len(data) < 0x800 or data[:8] != b"PS-X EXE":
                  raise SystemExit(f"{name}: invalid PS-X EXE header")
              values = struct.unpack_from("<10I", data, 0x10)
              print(f"=== {name} PS-X EXE ===")
              print(f"file={path} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}")
              print(f"header_fields={data[0x10:0x38].hex()}")
              for key, value in zip(fields, values):
                  print(f"{key}=0x{value:08X}")
          if files["original"].read_bytes() == files["rebuilt"].read_bytes():
              print("original_and_rebuilt_binary=IDENTICAL")
          else:
              print("original_and_rebuilt_binary=DIFFERENT")
          PY
