name: Stage 5 MIPS GNU Linker

on:
  pull_request:
    paths:
      - ".github/workflows/stage5-mips-gnu-linker.yml"
      - "cmake/overlay.ld.in"
      - "cmake/psx-toolchain.cmake"
      - "tests/test_maspsx_trampoline_section.py"
      - "tools/mips/symbols.py"

permissions:
  contents: read

jobs:
  mips-gnu-linker:
    name: MIPS objects, GNU ld, and linker map
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Install MIPS GNU binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils-mips-linux-gnu

      - name: Confirm target MIPS tools
        run: |
          command -v mips-linux-gnu-as
          command -v mips-linux-gnu-ld
          command -v mips-linux-gnu-nm
          mips-linux-gnu-as --version
          mips-linux-gnu-ld --version

      - name: Link MIPS objects and inspect GNU linker map
        run: |
          python3 -m unittest discover -s tests -p 'test_maspsx_trampoline_section.py' -v
